<form class="page-editor" [formGroup]="form" (ngSubmit)="submit()">
  <input id="page-title" class="title-input" formControlName="title" placeholder="Unbenannte Seite" />
  @if (form.controls.title.touched && form.controls.title.hasError('required')) {
    <p class="field-error">Der Titel ist erforderlich.</p>
  }

  <input
    id="page-description"
    class="description-input"
    formControlName="description"
    placeholder="Kurze Zusammenfassung, Kontext oder Ziel der Seite..."
  />

  <div class="editor-toolbar" role="toolbar" aria-label="Formatierung">
    <div class="toolbar-group" aria-label="Textstil">
      <button type="button" class="tool-button" [class.active]="!isActive('heading')" (click)="setParagraph()">
        Text
      </button>
      <button type="button" class="tool-button" [class.active]="isHeading(1)" (click)="toggleHeading(1)">
        H1
      </button>
      <button type="button" class="tool-button" [class.active]="isHeading(2)" (click)="toggleHeading(2)">
        H2
      </button>
      <button type="button" class="tool-button" [class.active]="isHeading(3)" (click)="toggleHeading(3)">
        H3
      </button>
    </div>

    <div class="toolbar-group" aria-label="Inline-Formatierung">
      <button type="button" class="tool-button strong" [class.active]="isActive('bold')" (click)="toggleBold()">
        B
      </button>
      <button type="button" class="tool-button italic" [class.active]="isActive('italic')" (click)="toggleItalic()">
        I
      </button>
      <button type="button" class="tool-button mono" [class.active]="isActive('code')" (click)="toggleCode()">
        Code
      </button>
      <button type="button" class="tool-button" [class.active]="isActive('link')" (click)="setLink()">
        Link
      </button>
    </div>

    <div class="toolbar-group" aria-label="Bloecke">
      <button
        type="button"
        class="tool-button"
        [class.active]="isActive('bulletList')"
        (click)="toggleBulletList()"
      >
        Liste
      </button>
      <button
        type="button"
        class="tool-button"
        [class.active]="isActive('orderedList')"
        (click)="toggleOrderedList()"
      >
        1. Liste
      </button>
      <button type="button" class="tool-button" [class.active]="isActive('blockquote')" (click)="toggleBlockquote()">
        Zitat
      </button>
      <button type="button" class="tool-button" [class.active]="isActive('codeBlock')" (click)="toggleCodeBlock()">
        Codeblock
      </button>
    </div>

    <div class="toolbar-group" aria-label="Tabelle">
      <button type="button" class="tool-button" (click)="insertTable()">Tabelle</button>
      <button type="button" class="tool-button" [disabled]="!isTableActive()" (click)="addTableRow()">
        Zeile +
      </button>
      <button type="button" class="tool-button" [disabled]="!isTableActive()" (click)="addTableColumn()">
        Spalte +
      </button>
      <button type="button" class="tool-button danger" [disabled]="!isTableActive()" (click)="deleteTable()">
        Entfernen
      </button>
    </div>

    <div class="toolbar-group" aria-label="Verlauf">
      <button type="button" class="tool-button" [disabled]="!canUndo()" (click)="undo()">Rueckgaengig</button>
      <button type="button" class="tool-button" [disabled]="!canRedo()" (click)="redo()">Wiederholen</button>
    </div>
  </div>

  <div #editorHost id="page-content" class="editor-surface"></div>

  <input
    id="page-tags"
    class="tags-input"
    formControlName="tags"
    placeholder="Tags: nestjs, backend, typescript"
  />

  <div class="editor-actions">
    <button type="button" class="button" (click)="cancel.emit()">Abbrechen</button>
    <button type="submit" class="button primary" [disabled]="saving() || form.invalid">
      {{ saving() ? 'Speichert...' : 'Speichern' }}
    </button>
  </div>
</form>
