<div class="app-shell">
  <bv-sidebar
    [spaces]="store.filteredSpaces()"
    [loading]="store.loading()"
    [saving]="store.saving()"
    [dragDisabled]="editMode()"
    [openSpaces]="openSpaces()"
    [activePageId]="storageActive() ? null : store.activePageId()"
    [activeSpaceId]="storageActive() ? null : activeSidebarSpaceId()"
    [storageActive]="storageActive()"
    [searchQuery]="store.searchQuery()"
    (toggleSpace)="toggleSpace($event)"
    (selectSpace)="selectSpace($event)"
    (selectPage)="selectPage($event)"
    (selectStorage)="selectStorage()"
    (searchQueryChange)="store.setSearchQuery($event)"
    (createSpace)="createSpace($event)"
    (deleteSpace)="requestDeleteSpace($event)"
    (movePageToSpace)="movePageToSpace($event)"
    (openSettings)="settingsOpen.set(true)"
  />

  <main class="main">
    <bv-topbar
      [activeSpacePath]="store.activeSpacePath()"
      [activePage]="store.activePage()"
      [editMode]="editMode()"
      [saving]="store.saving()"
      [storageActive]="storageActive()"
      (showCreatePage)="showNewPage.set(!showNewPage())"
      (startEdit)="editMode.set(true)"
      (deletePage)="deleteActivePage()"
      (cancelEdit)="editMode.set(false)"
      (savePage)="savePageFromTopbar()"
    />

    @if (store.error(); as error) {
      <div class="app-alert" role="alert">
        <span>{{ error }}</span>
        <button type="button" class="button" (click)="store.dismissError()">Schliessen</button>
      </div>
    }

    @if (!storageActive() && showNewPage()) {
      <form class="new-page-bar" [formGroup]="newPageForm" (ngSubmit)="submitNewPage()">
        <input class="new-page-input" formControlName="title" placeholder="Titel der neuen Seite..." />
        <select class="new-page-select" formControlName="spaceId">
          <option value="" disabled>Space waehlen...</option>
          @for (entry of store.flattenedSpaces(); track entry.space.id) {
            <option [value]="entry.space.id">{{ '-- '.repeat(entry.depth) }}{{ entry.space.name }}</option>
          }
        </select>
        <button type="submit" class="button primary" [disabled]="store.saving() || newPageForm.invalid">
          Erstellen
        </button>
        <button type="button" class="button" (click)="showNewPage.set(false)">Schliessen</button>
      </form>
    }

    <section class="content">
      @if (storageActive()) {
        <bv-storage />
      } @else if (store.activePage(); as page) {
        @if (editMode()) {
          <bv-page-editor
            [page]="page"
            [linkableSpaces]="store.spaces()"
            [saving]="store.saving()"
            (save)="savePage($event)"
            (cancel)="editMode.set(false)"
          />
        } @else {
          <bv-page-view [page]="page" [space]="store.activeSpace()" />
        }
      } @else if (store.activeSpace(); as space) {
        <bv-space-overview
          [space]="space"
          [saving]="store.saving()"
          (selectPage)="selectPage($event)"
          (selectSpace)="selectSpace($event)"
          (renameSpace)="renameSpace($event)"
          (createSubspace)="createSpace($event)"
        />
      } @else if (!store.loading()) {
        <bv-empty-state
          title="Waehle eine Seite aus der Navigation"
          description="oder erstelle eine neue Seite."
        />
      }
    </section>
  </main>

  <bv-confirm-modal
    [open]="deleteDialog() !== null"
    [title]="deleteDialogTitle()"
    [message]="deleteDialogMessage()"
    [confirmLabel]="deleteDialogConfirmLabel()"
    [cancelLabel]="'Abbrechen'"
    [pendingLabel]="'Löscht...'"
    [pending]="store.saving()"
    [danger]="true"
    (cancel)="closeDeleteDialog()"
    (confirm)="confirmDelete()"
  />

  <bv-settings-modal
    [open]="settingsOpen()"
    (close)="settingsOpen.set(false)"
  />
</div>
