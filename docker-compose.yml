services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: brainvault
      POSTGRES_USER: brainvault
      POSTGRES_PASSWORD: brainvault_secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brainvault"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  gotenberg:
    image: brainvault-gotenberg:8.17.3
    build:
      context: ./gotenberg
      dockerfile: Dockerfile
    restart: unless-stopped
    command:
      - "gotenberg"
      - "--chromium-allow-list=^http://frontend(:80)?/.*"
      - "--api-timeout=120s"
    environment:
      HOME: /tmp
    networks:
      - default
      - conversion
    read_only: true
    tmpfs:
      - /tmp:size=256m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 768m
    cpus: 1.5
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    image: brainvault-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-3001}:3000"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: brainvault
      DB_USER: brainvault
      DB_PASS: brainvault_secret
      DB_MIGRATIONS_RUN: "true"
      PORT: 3000
      NODE_ENV: development
      UPLOAD_DIR: /app/uploads
      MAX_IMAGE_UPLOAD_BYTES: 5242880
      MAX_PDF_UPLOAD_BYTES: 26214400
      REDIS_HOST: redis
      REDIS_PORT: 6379
      GOTENBERG_URL: http://gotenberg:3000
      FRONTEND_EXPORT_BASE_URL: http://frontend
      PREVIEW_CONVERSION_TIMEOUT_MS: 120000
      MAX_PREVIEW_BYTES: 104857600
      PREVIEW_GENERATOR_VERSION: gotenberg-8.17.3-office-fonts-v1
      CORS_ORIGINS: http://localhost:4200,http://localhost
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  preview-worker:
    image: brainvault-backend:latest
    restart: unless-stopped
    command: ["node", "dist/preview-worker"]
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: brainvault
      DB_USER: brainvault
      DB_PASS: brainvault_secret
      DB_MIGRATIONS_RUN: "true"
      NODE_ENV: development
      UPLOAD_DIR: /app/uploads
      REDIS_HOST: redis
      REDIS_PORT: 6379
      GOTENBERG_URL: http://gotenberg:3000
      PREVIEW_CONVERSION_TIMEOUT_MS: 120000
      MAX_PREVIEW_BYTES: 104857600
      PREVIEW_WORKER_CONCURRENCY: 1
      PREVIEW_GENERATOR_VERSION: gotenberg-8.17.3-office-fonts-v1
      PREVIEW_WORKER_ENABLED: "true"
      PREVIEW_WORKER_PORT: 3001
    volumes:
      - uploads:/app/uploads
    networks:
      - default
      - conversion
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      gotenberg:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  uploads:
  redisdata:

networks:
  conversion:
    internal: true
