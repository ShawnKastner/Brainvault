name: Build and publish private Docker images

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Optional image tag (e.g. v1.0.0). Leer = commit SHA"
        required: false
        type: string
      publish_latest:
        description: "Zusätzlich den latest-Tag pushen"
        required: true
        default: true
        type: boolean
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish backend/frontend images to GHCR
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - image_name: brainvault-backend
            context: ./backend
          - image_name: brainvault-frontend
            context: ./frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare tags
        id: prep
        env:
          INPUT_TAG: ${{ github.event.inputs.image_tag }}
          PUBLISH_LATEST: ${{ github.event.inputs.publish_latest }}
          DEFAULT_SHA: ${{ github.sha }}
          OWNER: ${{ github.repository_owner }}
          IMAGE_NAME: ${{ matrix.image_name }}
        run: |
          set -euo pipefail
          SHORT_SHA="${DEFAULT_SHA::7}"
          OWNER_LOWER="$(echo "${OWNER}" | tr '[:upper:]' '[:lower:]')"

          TAG="${INPUT_TAG:-}" 
          if [ -z "${TAG}" ]; then
            TAG="sha-${SHORT_SHA}"
          fi

          IMAGE="ghcr.io/${OWNER_LOWER}/${IMAGE_NAME}"
          TAGS="${IMAGE}:${TAG}"

          if [ "${PUBLISH_LATEST}" = "true" ]; then
            TAGS="${TAGS},${IMAGE}:latest"
          fi

          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.image_name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          provenance: false
          tags: ${{ steps.prep.outputs.tags }}

      - name: Publish summary
        run: |
          {
            echo "### Published image"
            echo "- Image: \`${{ steps.prep.outputs.image }}\`"
            echo "- Version tag: \`${{ steps.prep.outputs.tag }}\`"
            echo "- Tags pushed: \`${{ steps.prep.outputs.tags }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
