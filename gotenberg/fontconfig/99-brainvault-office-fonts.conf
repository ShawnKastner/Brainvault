<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!--
    Prefer real Aptos fonts when they are supplied in gotenberg/fonts.
    Arial is a substantially closer Office-layout fallback than Noto Sans.
  -->
  <alias binding="strong">
    <family>Aptos</family>
    <default>
      <family>Arial</family>
    </default>
  </alias>
  <alias binding="strong">
    <family>Aptos Display</family>
    <default>
      <family>Arial</family>
    </default>
  </alias>
</fontconfig>
